name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI, Postgres RLS, Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apms
          POSTGRES_PASSWORD: apms
          POSTGRES_DB: apms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Run database migrations
        env:
          DATABASE_URL_MIGRATE: postgresql+asyncpg://apms:apms@localhost:5432/apms
          DATABASE_URL: postgresql+asyncpg://apms_app:apms_app@localhost:5432/apms
        run: |
          cd backend
          alembic upgrade head

      - name: Seed database
        env:
          DATABASE_URL_MIGRATE: postgresql+asyncpg://apms:apms@localhost:5432/apms
          DATABASE_URL: postgresql+asyncpg://apms_app:apms_app@localhost:5432/apms
        run: |
          cd backend
          python -m app.seed

      - name: Run pytest test suite
        env:
          DATABASE_URL_MIGRATE: postgresql+asyncpg://apms:apms@localhost:5432/apms
          DATABASE_URL: postgresql+asyncpg://apms_app:apms_app@localhost:5432/apms
          JWT_SECRET: ci-dev-jwt-secret-minimum-32-bytes-long!
        run: |
          cd backend
          pytest -v

  frontend:
    name: Frontend (React, TypeScript, Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check and production build
        run: |
          cd frontend
          npm run build
