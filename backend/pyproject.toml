[project]
name = "apms-api"
version = "0.1.0"
description = "APMS tenant IAM and branch API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "bcrypt>=4.2",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
